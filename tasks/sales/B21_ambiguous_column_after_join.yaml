id: B21_ambiguous_column_after_join
kind: breakage
category: code_regression
difficulty: medium
title: Order fact fails after a half-finished change
trigger: ci_failure
mutation:
  - op: replace
    path: models/marts/core/fct_orders.sql
    old: "    max(case when is_quantity_outlier then 1 else 0 end) = 1        as has_quantity_outlier\nfrom lines\ngroup by invoice_id\n"
    new: "    max(case when is_quantity_outlier then 1 else 0 end) = 1        as has_quantity_outlier,\n    -- loyalty tier of the customer version valid when the order was placed\n    max(dim_customer.loyalty_tier)                                  as loyalty_tier_at_order\nfrom lines\ninner join {{ ref('dim_customer') }} as dim_customer\n    on lines.customer_sk = dim_customer.customer_sk\ngroup by invoice_id\n"
reference_fix:
  - op: replace
    path: models/marts/core/fct_orders.sql
    old: "    min(customer_sk)                                                as customer_sk,\n    min(customer_id)                                                as customer_id,\n"
    new: "    min(lines.customer_sk)                                          as customer_sk,\n    min(lines.customer_id)                                          as customer_id,\n"
hidden:
  assertions:
    - name: orders_preserved
      sql: select count(*) from gold.fct_orders
      expect: {from: base}
    - name: tier_column_kept_and_correct
      sql: >-
        select count(*) from gold.fct_orders as o
        join gold.dim_customer as c on o.customer_sk = c.customer_sk
        where o.loyalty_tier_at_order is distinct from c.loyalty_tier
      expect: {value: 0}
notes: >-
  A teammate started adding loyalty_tier_at_order to fct_orders; the join made two column
  names ambiguous. Dropping the new column also makes the build pass but loses the feature.

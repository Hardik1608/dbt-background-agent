name: sales_analytics
version: "1.0.0"
config-version: 2
profile: sales_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # --- data-quality rules (silver) -------------------------------------------------
  # |quantity| at or above this is flagged as a bulk outlier. In the real data the max
  # |quantity| is 80,995 (an order cancelled the same morning) and 15 lines reach the
  # threshold (analysis 00_bronze_data_profile + reports/real/pipeline_run.json).
  outlier_quantity_threshold: 10000

  # --- SCD2 customer dimension -----------------------------------------------------
  # Loyalty tier = cumulative net merchandise spend (GBP). Round-number boundaries
  # chosen after profiling the long-tailed lifetime-spend distribution.
  loyalty_tier_thresholds:
    silver: 1000
    gold: 5000
    platinum: 20000
  scd_end_of_time: "9999-12-31 00:00:00"
  scd_start_of_time: "1900-01-01 00:00:00"

  # --- ML features / labels --------------------------------------------------------
  feature_cutoff_start: "2010-03-01"   # first monthly cutoff (3 months of history)
  churn_horizon_days: 90               # churned = no purchase in [cutoff, cutoff + 90d)
  active_lookback_days: 365            # labelled population = bought in the prior 365d

models:
  sales_analytics:
    +materialized: view
    staging:            # silver: typed, standardised, flagged (1:1 with bronze)
      +schema: silver
      +materialized: view
    intermediate:       # silver: deduplicated + business logic shared by marts
      +schema: silver
      +materialized: table
    marts:              # gold: star schema, analytics and ML feature marts
      +schema: gold
      +materialized: table
      core:
        +tags: ["star_schema"]
      analytics:
        +tags: ["analytics"]
      ml:
        +tags: ["ml"]

seeds:
  sales_analytics:
    +schema: reference

snapshots:
  sales_analytics:
    +schema: snapshots

data_tests:
  sales_analytics:
    +store_failures: false
